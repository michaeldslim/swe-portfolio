<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Interview Guide</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/atom-one-dark.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
          <div><center><a href="../"><h4>Tech hub</h4></a></center></div>
            <div class="sidebar-header">
                <h1><i class="fab fa-js"></i> jQuery Interview</h1>
                <p class="subtitle">Complete Interview Guide</p>
            </div>
            <div class="document-selector">
                <select id="document-select">
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <div class="sidebar-content">
                <div id="question-list"></div>
            </div>
        </div>
        <div class="content">
            <div class="content-header">
                <h2 id="current-title">jQuery Interview Guide</h2>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <div class="content-body">
                <div id="document-content"></div>
            </div>
        </div>
    </div>
    
    <!-- Loading indicator -->
    <div class="loading-indicator" id="loading-indicator">
        <div class="spinner"></div>
        <p>Loading content...</p>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
